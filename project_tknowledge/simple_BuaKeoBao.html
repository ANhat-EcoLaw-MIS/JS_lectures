<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        #main button:hover{
            cursor: pointer;
            background-color: blue;
            font-weight: bolder;
            color:white;
        }
        #main button:active{
            background-color: red;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Improvements: Better logic - Incorporate a "repository" - local storage... (Later);
            const game = document.querySelector('#gameForm');
            const choiceButton = document.querySelectorAll('.choice-button');
            let computerMove = '';
            let userMove = '';
            let textBox = document.querySelector("small");
            const textBoxDefault = textBox.innerText;
            game.addEventListener('submit', function(event) {whoWin(event)});
            choiceButton.forEach(button=>{
                button.addEventListener('click', function(event){
                    textBox.innerText = textBoxDefault + button.innerText;
                    computerMove = pickComputerMove();
                    userMove= event.target.innerText;
                }
                )
            });

            function pickComputerMove() {
                const randomNumber = Math.random();
                if (randomNumber > 0 && randomNumber < 1 / 3) {
                    computerMove = 'Búa';
                } else if (randomNumber < 2 / 3) {
                    computerMove = 'Kéo';
                } else {
                    computerMove = 'Bao';
                }
                return computerMove;
            }

            function whoWin(event){
                event.preventDefault();
                const default_string = `The user picked: ${userMove} - the computer picked: ${computerMove}`;
                let result = ''
                if (userMove === computerMove) {
                    alert(default_string + '\nthe result is: Ties')
                    return null;
                }

                if (userMove==='Búa'){
                    if (computerMove==='Bao'){
                        result ='Người dùng thua rồi !';
                    }else{
                        result ='Người dùng thắng rồi !';
                    }
                }
                if (userMove==='Bao'){
                    if (computerMove==='Kéo'){
                        result = 'Người dùng thua rồi !';
                    }else{
                        result='Người dùng thắng rồi !';
                    }
                }
                if (userMove==='Kéo'){
                    if (computerMove==='Bao'){
                        result='Người dùng thắng rồi !';
                    }else{
                        result='Người dùng thua rồi !';
                    }
                }

                alert(default_string+'\n'+result);
            }
        }, false);
    </script>
    <title>Búa kéo bao huhu !</title>
</head>
<body style="font-size:20pt; text-align: center;">
<header>
    <p>
        Welcome to Búa Kéo Bao - từ JavaScript...
    </p>
    <p>
        Hãy chọn cái mà bạn muốn đi ạ !
    </p>
</header>
<main id="main" style="border:1px solid black; padding: 10px; align-self: center; width:30%; margin: auto;">
    <p><small>Bạn đã chọn...</small></p>
    <form id="gameForm">
        <button class="choice-button">Búa</button>
        <button class="choice-button">Kéo</button>
        <button class="choice-button">Bao</button>
    </form>
</main>

</body>
</html>
