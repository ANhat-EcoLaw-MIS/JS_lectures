<!-- this is basically a very poor version of the website !-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-do List</title>
    <style>
      .default-btn{
          margin: 5px;
          padding: 10px;
          background-color: dodgerblue;
      }
      .default-btn:hover{
          cursor: pointer;
          background-color: firebrick;
      }
      .default-btn:active{
          background-color: lightskyblue;
      }
      .default-input{
          margin: 10px;
          padding: 10px;
          font-size: 15px;
      }
      form{
          margin-right: 600px;
          border: 1px solid black;
          padding: 10px;
      }

      #list{
          border: 1px solid black;
          margin-right: 600px;
          overflow: scroll;
      }
      footer{
        margin-top: 50px;
      }
      #list p{
          padding: 20px;
          font-size: 15pt;
      }
      #list p:hover{
          background-color: firebrick;
      }
      #list p button{
          margin-left: 50%;
          background-color: green;
          color: white;
          padding: 10px;
          border:none;
      }
      #list p button:hover{
          cursor: pointer;
          background-color: lightskyblue;
      }
      #list p label{
          margin-left: 100px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        let myArr = [];
        let increment = 0;
        const button = document.getElementById("button-sub");
        const input_field = document.querySelector('label input');
        const list = document.getElementById("list");
        const date_field = document.getElementById('input-field-date');
        const deleteItem = function (id) {
            console.log('item when deleting', id);
            myArr = myArr.filter(item => item.id !== id);
            console.log('After deleting', myArr);
            renderList(myArr);
        }
        const renderList = (arr) => {
            list.innerHTML = '';
            arr.forEach((item) =>{
                console.log('item id', item.id);
                const p = document.createElement('p');
                const label = document.createElement('label');
                const btn = document.createElement('button');
                p.textContent = item.task;
                label.textContent = item.date;
                btn.textContent = 'Delete';
                btn.dataset.id =item.id;
                btn.addEventListener('click',() => deleteItem(item.id)); // item id là incrementing
                p.appendChild(label); // add vào cái label - cái btn mình đã tạo
                p.appendChild(btn);
                list.appendChild(p);
            });

        }
        button.addEventListener('click', function(event) {
          event.preventDefault();
          if (!(input_field.value && date_field.value)) {
              document.querySelector('#p-alert').innerHTML = "Please enter a valid input";
              return null;
          }
            const newItem={
              task: input_field.value,
              date: date_field.value,
              id: increment
          }
          myArr.push(newItem);
          increment++;
          console.log(myArr);
          renderList(myArr);
        })
        document.querySelector('#button-reset').addEventListener('click', function() {
            list.innerHTML ='';
            document.querySelector('#p-alert').innerHTML = "";
        })
      });
    </script>
</head>
<body style="background-color: white;">
<header>
  <h1>To-do List</h1>
</header>
<main>
  <form>
    <label><input id="input-field-task" class="default-input" type="text" placeholder="What needs to be done?"></label>
      <label><input class="default-input" id = "input-field-date" type="date"></label>
    <input class="default-btn" id="button-sub" type="submit" value="Add task !">
      <input class="default-btn" id="button-reset" type="reset" value="Reset">
  </form>
    <p id="p-alert" style="color: red;"></p>
</main>
<footer>
  <p style="font-size:15pt; font-family: 'Courier New',serif; font-weight:bold;">current list !</p>
  <div id="list"></div>
</footer>
</body>
</html>
