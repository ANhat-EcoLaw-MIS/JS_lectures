<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-do List</title>
    <style>
      #list{
          width: 500px;
          height: 300px;
          overflow-block: auto;
      }
      footer{
        margin-top: 50px;
      }
      #list li{
          padding: 10px;
      }
      #list li:hover{
          background-color: firebrick;
      }
      #list li button{
          margin-left: 80%;
          background-color: green;
          color: white;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const myArr = [];
        const button = document.getElementById("button-sub");
        const input_field = document.querySelector('label input');
        const list = document.getElementById("list");
        button.addEventListener('click', function(event) {
          event.preventDefault();
          let content = input_field.value;
          list.innerHTML += `<li>${content}</li>`;
          myArr.push(content);
          console.log(myArr);
        })
        document.querySelector('#button-reset').addEventListener('click', function(event) {
            list.innerHTML ='';
        })
      });
    </script>
</head>
<body style="background-color: whitesmoke;">
<header>
  <h1>To-do List</h1>
</header>
<main>
  <form>
    <label><input type="text" placeholder="What needs to be done?"></label>
    <input id="button-sub" type="submit" value="Add task !">
      <input id="button-reset" type="reset" value="Reset">
  </form>
</main>
<footer>
  <p>current list !</p>
  <ol id="list"></ol>
</footer>
</body>
</html>
