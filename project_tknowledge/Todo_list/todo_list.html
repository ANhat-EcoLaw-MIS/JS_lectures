<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-do List</title>
    <style>
      .default-btn{
          margin: 5px;
          padding: 10px;
          background-color: blueviolet;
      }
      .default-btn:hover{
          cursor: pointer;
          background-color: firebrick;
      }
      .default-btn:active{
          background-color: lightskyblue;
      }
      .default-input{
          margin: 10px;
          padding: 10px;
          font-size: 15px;
      }
      form{
          margin: auto;
          border: 1px solid black;
          padding: 10px;
      }
      #input-field-task{
      }
      #list{
          margin: auto;
          overflow: auto;
      }
      footer{
        margin-top: 50px;
      }
      #list p{
          padding: 20px;
          font-size: 15pt;
      }
      #list p:hover{
          background-color: firebrick;
      }
      #list p button{
          margin-left: 45%;
          background-color: green;
          color: white;
          padding: 10px;
          border:none;
      }
      #list p label{
          margin-left: 100px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const myArr = [];
        const button = document.getElementById("button-sub");
        const input_field = document.querySelector('label input');
        const list = document.getElementById("list");
        const date_field = document.getElementById('input-field-date');
        button.addEventListener('click', function(event) {
          event.preventDefault();
          if (!(input_field.value && date_field.value)) {
              document.querySelector('#p-alert').innerHTML = "Please enter a valid input";
              return null;
          }
          let element = `<p>${input_field.value} <label>${date_field.value}</label><button>delete</button></p>`;
          list.innerHTML += element;
          // console.log(myArr);
        })
        document.querySelector('#button-reset').addEventListener('click', function() {
            list.innerHTML ='';
            document.querySelector('#p-alert').innerHTML = "";
        })
      });
    </script>
</head>
<body style="background-color: whitesmoke;">
<header>
  <h1>To-do List</h1>
</header>
<main>
  <form>
    <label><input id="input-field-task" class="default-input" type="text" placeholder="What needs to be done?"></label>
      <label><input class="default-input" id = "input-field-date" type="date"></label>
    <input class="default-btn" id="button-sub" type="submit" value="Add task !">
      <input class="default-btn" id="button-reset" type="reset" value="Reset">
  </form>
    <p id="p-alert" style="color: red;"></p>
</main>
<footer>
  <p style="font-size:15pt; font-family: 'Courier New',serif; font-weight:bold;">current list !</p>
  <div id="list"></div>
</footer>
</body>
</html>
