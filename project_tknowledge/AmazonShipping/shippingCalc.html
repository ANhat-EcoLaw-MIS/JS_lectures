<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href=amazonStyle.css type="text/css">
    <script src="amazonScript.js"></script>
    <title>Shipping Calculator</title>
</head>
<body>
  <header><p>Amazon Shipping Calculator</p></header>
  <main>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = Free Shipping !</p>
    <form class="normal-form" onsubmit="">
      <label>
        <input autocomplete="off" autofocus id="field-input" type ='text' placeholder="Cost of order" required>
        <input type="submit" value="Calculate">
        <input type="reset" value="Reset">
      </label>
      <p>Total: ...</p>
    </form>
  </main>
</body>
</html>
